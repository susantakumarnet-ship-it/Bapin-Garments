# Production-like stack: MongoDB + Bapin Garments app.
#   1. cp server/.env.example .env  and set JWT_SECRET, ENCRYPTION_KEY, etc.
#   2. docker compose up -d --build
#   3. open http://localhost:4000
# To use MongoDB Atlas instead, remove the `db` service and set MONGODB_URI in .env.
services:
  db:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://db:27017
      MONGODB_DB: BapinGarments
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:4000}
      CORS_ORIGINS: ${PUBLIC_SITE_URL:-http://localhost:4000}
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/server/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  mongodata:
  uploads:
